name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener-ci-password
          POSTGRES_DB: shortener
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortener" --health-interval 2s
          --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://shortener:shortener-ci-password@localhost:5432/shortener_test
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://shortener:shortener-ci-password@localhost:5432/shortener
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Tests with coverage (fails under 85%)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test the compose stack
        run: |
          docker compose up -d --build --wait
          curl --fail --silent http://localhost:8000/readyz
          KEY=$(docker compose exec -T api python -m app.cli create-api-key --name ci --quiet)
          CODE=$(curl --fail --silent -X POST http://localhost:8000/api/v1/links \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"url": "https://en.wikipedia.org/wiki/URL_shortening"}' | jq -r .code)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/$CODE)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/v1/links \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"url": "http://paypal.com.secure-login-verify-account.xyz/webscr/cmd=_login-submit/update.php"}')" = 422
      - name: Logs on failure
        if: failure()
        run: docker compose logs
