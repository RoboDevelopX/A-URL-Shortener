# Local stack: `docker compose up` (or `make up`) starts everything in dependency order:
# postgres + redis -> migrate (one-shot) -> api + worker (click ingestion).
#
# The ${VAR:-default} fallbacks below are development-only values so the stack starts
# without any setup. Real deployments must provide their own (see .env.example).

x-app: &app
  build: .
  image: url-shortener:local
  environment: &app-env
    ENVIRONMENT: ${ENVIRONMENT:-dev}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD:-shortener-dev-password}@postgres:5432/${POSTGRES_DB:-shortener}
    REDIS_URL: redis://redis:6379/0
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    CODE_SECRET: ${CODE_SECRET:-dev-only-code-secret-change-me}
    API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-only-pepper-change-me}
    RATE_LIMIT_CREATE_PER_KEY: ${RATE_LIMIT_CREATE_PER_KEY:-60}
    RATE_LIMIT_CREATE_PER_IP: ${RATE_LIMIT_CREATE_PER_IP:-120}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # AOF persistence so queued click events survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
